name: Update ClawBank adoption snapshot

on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-clawbank-adoption-2026-09.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1
      - name: Update and validate the adoption snapshot
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha1
          from html.parser import HTMLParser
          from collections import Counter

          path = Path('index.html')
          original_bytes = path.read_bytes()
          blob_sha = sha1(b'blob ' + str(len(original_bytes)).encode() + b'\0' + original_bytes).hexdigest()
          assert blob_sha == '2e7edeec0cc1be1971ee31fb38a9abdcb8581ab7', 'Homepage changed since review; refusing to overwrite concurrent edits.'
          original = original_bytes.decode('utf-8')
          old_snapshot = '<li>By July 2026: 1,000+ agents, 83 bank accounts, 14 agent-run U.S. companies, and 43 legal contracts between agents.</li>'
          new_snapshot = (
              '<!-- September 22, 2026 snapshot supplied by the site owner from https://app.clawbank.co/tokenomics. Metrics are reported separately, not added together. -->\n'
              '\t\t\t\t\t\t<li>Adoption as of September 22, 2026: 1,633 agents, 95 USD bank accounts, 16 U.S. companies incorporated, and 45 contracts with 129 milestones.</li>\n'
              '\t\t\t\t\t\t<li>Platform activity at the same snapshot: approximately $298K in total value moved across 27,949 onchain transactions; 556,848 x402 transactions and 996 services listed.</li>'
          )
          old_links = '<li><a href="https://clawbank.co/" target="_blank" rel="noopener">Website</a> &amp; <a href="https://app.clawbank.co/docs" target="_blank" rel="noopener">Docs</a></li>'
          new_links = '<li><a href="https://clawbank.co/" target="_blank" rel="noopener">Website</a> &amp; <a href="https://app.clawbank.co/docs" target="_blank" rel="noopener">Docs</a> &amp; <a href="https://app.clawbank.co/tokenomics" target="_blank" rel="noopener">Adoption metrics</a></li>'
          assert original.count(old_snapshot) == 1
          assert original.count(old_links) == 1
          updated = original.replace(old_snapshot, new_snapshot, 1).replace(old_links, new_links, 1)
          assert updated.replace(new_snapshot, old_snapshot, 1).replace(new_links, old_links, 1) == original, 'Unexpected changes outside the snapshot and source link.'
          assert old_snapshot not in updated
          assert 'Acquired by Thrive Protocol in August 2025.' in updated
          assert 'https://github.com/BanklessDAO/bankless-dao-constitution' not in updated

          class Structure(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.tags = Counter()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  self.tags[tag] += 1
                  self.ids.extend(value for key, value in attrs if key == 'id')
              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)

          before, after = Structure(), Structure()
          before.feed(original)
          after.feed(updated)
          before.close()
          after.close()
          assert before.ids == after.ids, 'Navigation changed.'
          assert after.tags == before.tags + Counter({'li': 1, 'a': 1}), 'Unexpected structural changes.'
          path.write_bytes(updated.encode('utf-8'))
          print('PASS: September 22 snapshot matches supplied dashboard figures; activity categories remain separate.')
          print('PASS: Only the ClawBank adoption snapshot and its source link changed; all other content preserved.')
          PY
          git diff --check
          test "$(git diff --name-only)" = 'index.html'
          git diff --stat
      - name: Commit and push the snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'Update ClawBank adoption to September 22, 2026 dashboard snapshot'
          git push origin HEAD:main
