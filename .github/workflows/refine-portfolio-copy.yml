name: Refine portfolio copy

on:
  push:
    branches: [main]
    paths: ['.github/workflows/refine-portfolio-copy.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1
      - name: Update copy and verify that unrelated content is unchanged
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html import escape
          from html.parser import HTMLParser
          from collections import Counter
          import hashlib
          import re

          path = Path('index.html')
          raw = path.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert blob == 'eee483a6ad0db3134db5358782e97c9ed1bbba3d', 'Homepage changed since review; refusing to overwrite concurrent work.'
          original = raw.decode('utf-8')
          content = original

          def replace_once(old, new):
              global content
              assert content.count(old) == 1, f'Expected one match: {old[:100]}'
              content = content.replace(old, new, 1)

          intro = (
              'I build software that turns complex workflows into working systems. '
              'My experience spans 15+ years in web development, enterprise delivery, distributed protocols, and AI automation, '
              'taking problems from discovery and architecture through implementation and deployment. '
              'Most recently, I founded and built ClawBank: infrastructure that lets AI agents form companies, open bank accounts, '
              'execute contracts, and resolve disputes. My strength is connecting the business problem to the technical details, '
              'then staying hands-on until the system works.'
          )
          replace_once('Founder. Strategist. Forward-Deployed.', 'Builder. Founder. Systems Thinker.')
          replace_once('Autonomous Systems · Distributed Protocol Architecture · AI Workflows', 'Applied AI · Agent Infrastructure · Full-Stack Engineering')
          replace_once(
              'Operator, founder, and technologist with 15+ years across software development, large scale agile programs, and Web3-native organizations. Proven record of building and scaling complex socio-technical systems including DAO governance, grant programs, bonding curve launchpads, and agent-driven automation. Comfortable operating from code and architecture through org design, incentives, and capital allocation. Known for high-velocity execution, systems thinking, and translating emerging technology into durable operational primitives.',
              escape(intro, quote=False)
          )
          replace_once('content="HTML5 Page"', 'content="Justice Conder, applied AI, agent infrastructure, full-stack engineering, forward-deployed engineering"')
          replace_once('content="Justice Gödel Conder CV"', 'content="Justice Conder — hands-on software builder and founder. Applied AI, agent infrastructure, full-stack systems, and end-to-end technical delivery."')
          replace_once(
              'Technically capable founder and strategist preparing for forward-deployed engineering and strategy roles at AI companies.',
              'Hands-on software builder and founder working across applied AI, agent infrastructure, and full-stack systems.'
          )
          tags = [
              'Applied AI and agent workflows',
              'Full-stack product development',
              'API design and systems integration',
              'Elixir / Phoenix · Python / FastAPI',
              'Rapid prototyping and deployment',
              'Technical discovery and problem solving',
              'Distributed systems and protocols',
              'Cross-functional delivery'
          ]
          content, count = re.subn(
              r'(<ul class="hero-tags">).*?(</ul>)',
              lambda m: m[1] + '\n' + ''.join('\t\t\t\t<li>' + escape(t, quote=False) + '</li>\n' for t in tags) + '\t\t\t' + m[2],
              content, count=1, flags=re.S
          )
          assert count == 1

          roles = [
              ('ClawBank', [
                  'Founded and built a production platform that lets AI agents form U.S. companies, open bank accounts, maintain corporate records, and negotiate and sign contracts.',
                  'Architected the platform around Elixir/Phoenix and LiveView, with Python/FastAPI services, background jobs, and third-party API integrations.',
                  'Unified banking, wallets, company formation, and DocuSign signing behind REST APIs, MCP tools, a CLI, and an SMS interface.',
                  'Built agent-to-agent contracting with onchain agreement records, escrow-backed milestones, and Kleros arbitration on Base.',
                  'Extended the platform with ClawBank OS: an agent-operated workspace for websites, business documents, marketing, and daily execution.',
                  'By July 2026: 1,000+ agents, 83 bank accounts, 14 agent-run U.S. companies, and 43 legal contracts between agents.'
              ]),
              ('Thrive Protocol', [
                  'Designed and built the Thrive Guardian Network API, an x402-powered marketplace for programmatic research and project evaluation.',
                  'Implemented deployable agents that gathered, normalized, and scored public project data against private evaluation rubrics.',
                  "Connected those workflows to Thrive's internal data lake and decision systems, turning unstructured research into structured diligence inputs."
              ]),
              ('Quadratic Accelerator', [
                  'Cofounded and launched a bonding-curve-based funding platform, reaching the top ten launchpads by total value locked on DefiLlama.',
                  'Launched 12 projects with integrated identity verification, Passport proof-of-humanity, and anti-sybil protections.',
                  'Connected funding mechanisms, participant incentives, and onboarding into a repeatable project-launch process.',
                  'Acquired by Thrive Protocol in August 2025.'
              ]),
              ('Polygon Labs', [
                  'Led technical business development for DAO tooling, helping ecosystem teams select and deploy governance and treasury infrastructure.',
                  "Designed and launched Polygon's community grants program, turning ecosystem funding goals into a working allocation program.",
                  'Served on the PolygonDAO grants committee and coordinated the Ethereum Adoption DAO and Metaverse Alliance DAO.'
              ]),
              ('BanklessDAO', [
                  'Cofounded FRAG Stack, a decentralized frontend stack built around Radicle and IPFS.',
                  'Served as the inaugural Governance Solution Engineering lead, translating governance decisions into the DAO constitution, operating handbook, and proposal standards.',
                  'Contributed to OpsGuild and co-authored the Sobol Cartographer program, documenting organizational structure and responsibilities.',
                  'Cofounded the Project Management Guild and Modern Agilist Podcast to develop and share practical delivery methods.'
              ]),
              ('UPMC Enterprises', [
                  "Designed the delivery and scaling model for MyUPMC's 45+ engineers, aligning team boundaries with product ownership.",
                  'Reorganized work into cross-functional teams and specialist groups to coordinate delivery across a growing healthcare software platform.',
                  'Created the MyUPMC Agility Handbook and delivery metrics framework; founded the Agile Working Group and MyUPMC University to make the approach repeatable.'
              ]),
              ('Highmark', [
                  'Organized four engineering teams to migrate three enterprise content systems to Adobe Experience Manager.',
                  'Introduced programmatic ETL-based migration rather than treating the work as a page-by-page rebuild, improving speed and data consistency.',
                  'Coordinated cross-team dependencies and made delivery progress and technical risks visible to engineering and business stakeholders.'
              ]),
              ('Fraction Software', [
                  'Advise organizations on whether blockchain is the right tool for the problem, with a focus on Ethereum and decentralized application architecture.',
                  'Evaluate platform tradeoffs, integration requirements, and smart-contract constraints before committing to implementation.',
                  'Translate business requirements into technical options and explain architectural decisions to non-technical stakeholders.'
              ]),
              ('33 Mile Radius', [
                  'Led the transition from a local, single-user application to a containerized, cloud-based platform serving multiple users.',
                  'Decoupled the application interface from backend build processes so jobs could run concurrently instead of blocking one another.',
                  'Built a small engineering team, led post-acquisition product integration, and delivered analytics and revenue dashboards.'
              ]),
              ('Sherwin-Williams', [
                  "Recreated an acquired company's web catalog in 24 hours during an emergency migration, keeping it online while its legacy server was retired.",
                  'Extracted product data into JSON and generated static pages with Handlebars.js, choosing a small, deployable solution under a hard deadline.'
              ]),
              ('Truth for Life', [
                  'Built and maintained frontend experiences and campaign landing pages.',
                  'Brought existing code into Git and established a shared workflow with third-party developers.',
                  'Introduced BrowserStack-based cross-browser testing and structured bug reporting to make releases easier to verify.'
              ]),
              ('Sherwin-Williams', [
                  'Developed and maintained corporate web properties and partner sites.',
                  'Built a multilingual European portal with international stakeholders and translators, adapting content and layouts across German, French, Russian, Italian, and other languages.'
              ])
          ]
          links = {
              'ClawBank': '<a href="https://clawbank.co/" target="_blank" rel="noopener">Website</a> &amp; <a href="https://app.clawbank.co/docs" target="_blank" rel="noopener">Docs</a>',
              'Quadratic Accelerator': '<a href="https://qacc.giveth.io/" target="_blank" rel="noopener">Website</a> &amp; <a href="https://cdn.prod.website-files.com/667d6bc0b1e956f8d0b52c92/671a9d6f3bbff2f4d648e809_qacc.pdf" target="_blank" rel="noopener">Whitepaper</a>'
          }
          pattern = re.compile(
              r'(?P<prefix><div class="experience">\s*<i class="ti-bookmark-alt"></i>\s*<h4 class="title-text">(?P<company>[^<]+)</h4>.*?<div class="desc">.*?<ul>)(?P<items>.*?)(?P<suffix></ul>)',
              re.S
          )
          matches = list(pattern.finditer(content))
          assert [m['company'] for m in matches] == [r[0] for r in roles], 'Unexpected work-history structure.'
          role_index = 0

          def rewrite_role(match):
              global role_index
              company, bullets = roles[role_index]
              role_index += 1
              prefix = match['prefix']
              if company == 'ClawBank':
                  prefix = prefix.replace('<h5>Founder</h5>', '<h5>Founder &amp; Builder</h5>')
              if company == 'Quadratic Accelerator':
                  assert prefix.count('>Aug 2026</time>') == 1
                  prefix = prefix.replace('>Aug 2026</time>', '>Aug 2025</time>')
                  prefix = prefix.replace('<time datetime="2018-6">Feb 2025</time>', '<time datetime="2025-02">Feb 2025</time>')
                  prefix = prefix.replace('<time datetime="2018-10">Aug 2025</time>', '<time datetime="2025-08">Aug 2025</time>')
              items = ''.join('\t\t\t\t\t\t<li>' + escape(b, quote=False) + '</li>\n' for b in bullets)
              if company in links:
                  items += '\t\t\t\t\t\t<li>' + links[company] + '</li>\n'
              return prefix + '\n' + items + '\t\t\t\t\t' + match['suffix']

          content, count = pattern.subn(rewrite_role, content)
          assert count == 12 and role_index == 12
          replace_once(
              'Started as bank accounts for agents; grew into legal entities, contracts, and arbitration. Core idea: agent autonomy.',
              'Production infrastructure for agent-run companies: banking, legal entities, contracts, and arbitration, accessible through APIs, MCP, CLI, and SMS. Built end to end on Elixir/Phoenix.'
          )
          replace_once(
              'Quadratic Accelerator launchpad, founded and built to a top-10 launchpad within six months before exiting. Routed ecosystem resources into early-stage projects so they could launch.',
              'Cofounded a bonding-curve funding platform that reached the top ten launchpads by TVL and launched 12 projects. Acquired by Thrive Protocol in August 2025.'
          )
          replace_once('<span>Side Project</span>', '<span>Selected Work</span>')

          class Structure(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.tags = Counter()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  self.tags[tag] += 1
                  for key, value in attrs:
                      if key == 'id':
                          self.ids.append(value)
              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)

          before, after = Structure(), Structure()
          before.feed(original)
          after.feed(content)
          before.close()
          after.close()
          for tag in ('html', 'head', 'body', 'title', 'meta', 'link', 'script', 'div', 'h1', 'h2', 'h4', 'h5', 'p', 'ul', 'article', 'img', 'svg', 'path', 'nav', 'figure', 'footer', 'time'):
              assert before.tags[tag] == after.tags[tag], f'Unexpected structural change: {tag}'
          assert before.ids == after.ids, 'Navigation IDs changed.'
          for marker in ('<!-- talks -->', '<!-- testimonials -->'):
              assert original.split(marker)[1] == content.split(marker)[1], f'Protected section changed: {marker}'
          assert original.split('<div class="subject-header">\n\t\t\t\t<span>Education</span>', 1)[1].split('<!-- portfolio -->', 1)[0] == content.split('<div class="subject-header">\n\t\t\t\t<span>Education</span>', 1)[1].split('<!-- portfolio -->', 1)[0], 'Education changed.'
          assert 'https://github.com/BanklessDAO/bankless-dao-constitution' not in content
          assert 'href="myupmc-agility-handbook.pdf"' not in content
          assert 'Acquired by Thrive Protocol in Aug 2026' not in content
          assert 'Aug 2026</time>' not in content
          assert 'Cybernetic Org Design' in content
          assert content.count('<article class="portfolio-item') == original.count('<article class="portfolio-item')
          assert content.count('<a href="blog.html">Writing</a>') == original.count('<a href="blog.html">Writing</a>')
          path.write_bytes(content.encode('utf-8'))
          print('PASS: All 12 work-history entries rewritten; q/acc corrected to August 2025; weak artifact links removed.')
          print('PASS: Hero, metadata, footer, and two related portfolio descriptions aligned.')
          print('PASS: Layout structure, navigation IDs, education, talks, recommendations, and writing links preserved.')
          PY
          git diff --check
          test "$(git diff --name-only)" = 'index.html'
          git diff --stat
      - name: Commit and push the reviewed copy
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'Refine portfolio for hands-on AI engineering; strengthen ClawBank and correct q/acc dates'
          git push origin HEAD:main
